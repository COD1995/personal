# Author
author:
  name: Jue Guo
  email: guoj1995@gmail.com
  github: COD1995
  linkedin: jue-g-3642a1187

# Contact form (Web3Forms). This access key is meant to be public — it only lets
# the form deliver messages to the inbox registered at web3forms.com.
web3forms_key: 77c1c150-b5f6-438d-ab35-969b87100619

# Build
markdown: kramdown
highlighter: rouge
permalink: pretty
sass:
  style: compressed

kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-sitemap

include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor
  - node_modules

# Collections
collections:
  teaching:
    output: true
    permalink: /teaching/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: ""
      type: teaching
    values:
      layout: page
