# Site
title: Jue Guo
tagline: Ph.D. candidate, Computer Science, University at Buffalo
email: jueguo@buffalo.edu
description: Personal website of Jue Guo — research, teaching, and notes on machine learning.
lang: en

# Deploy
url: https://cod1995.github.io
baseurl: /personal

# Author
author:
  name: Jue Guo
  email: jueguo@buffalo.edu
  github: COD1995
  linkedin: jue-g-3642a1187

# Build
markdown: kramdown
highlighter: rouge
permalink: pretty
sass:
  style: compressed

kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-sitemap

include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor
  - node_modules

# Collections
collections:
  teaching:
    output: true
    permalink: /teaching/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: ""
      type: teaching
    values:
      layout: page
