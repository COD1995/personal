<text x="378" y="138" font-size="15" fill="#1e1c19" text-anchor="middle">extraction</text>
<text x="378" y="174" font-size="11.5" fill="#5d574d" text-anchor="middle" font-family="'JetBrains Mono',Menlo,monospace">(length, hue)</text>
