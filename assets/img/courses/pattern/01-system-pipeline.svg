<text x="520" y="130" font-size="15" fill="#1e1c19" text-anchor="middle">Classification</text>
<text x="520" y="174" font-size="11.5" fill="#5d574d" text-anchor="middle" font-family="'JetBrains Mono',Menlo,monospace">lemon or lime</text>
