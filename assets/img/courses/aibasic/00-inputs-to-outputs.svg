    <text x="245" y="195" text-anchor="middle" font-size="11.5" fill="#5d574d">shape [3, 224, 224]</text>
  </g>
  <path d="M316 115 L352 115" stroke="#1f2e4a" stroke-width="1.3" marker-end="url(#a)"/>
