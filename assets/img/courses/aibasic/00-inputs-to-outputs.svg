  <g stroke="#b9ad96" stroke-width="0.8">
    <line x1="376" y1="70" x2="440" y2="60"/><line x1="376" y1="70" x2="440" y2="100"/><line x1="376" y1="70" x2="440" y2="140"/><line x1="376" y1="70" x2="440" y2="180"/>
    <line x1="376" y1="115" x2="440" y2="60"/><line x1="376" y1="115" x2="440" y2="100"/><line x1="376" y1="115" x2="440" y2="140"/><line x1="376" y1="115" x2="440" y2="180"/>
    <line x1="376" y1="160" x2="440" y2="60"/><line x1="376" y1="160" x2="440" y2="100"/><line x1="376" y1="160" x2="440" y2="140"/><line x1="376" y1="160" x2="440" y2="180"/>
    <line x1="440" y1="60" x2="504" y2="92"/><line x1="440" y1="100" x2="504" y2="92"/><line x1="440" y1="140" x2="504" y2="92"/><line x1="440" y1="180" x2="504" y2="92"/>
    <line x1="440" y1="60" x2="504" y2="138"/><line x1="440" y1="100" x2="504" y2="138"/><line x1="440" y1="140" x2="504" y2="138"/><line x1="440" y1="180" x2="504" y2="138"/>
  </g>
  <g fill="#fbf8f2" stroke="#1f2e4a" stroke-width="1.3">
    <circle cx="376" cy="70" r="9"/><circle cx="376" cy="115" r="9"/><circle cx="376" cy="160" r="9"/>
    <circle cx="440" cy="60" r="9"/><circle cx="440" cy="100" r="9"/><circle cx="440" cy="140" r="9"/><circle cx="440" cy="180" r="9"/>
    <circle cx="504" cy="92" r="9"/><circle cx="504" cy="138" r="9"/>
