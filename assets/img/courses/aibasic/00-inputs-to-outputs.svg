    <rect x="15" y="150" width="120" height="40" fill="#fbf8f2" stroke="#b9ad96"/><text x="75" y="175">Sensor signal</text>
  </g>
  <path d="M137 115 L172 115" stroke="#1f2e4a" stroke-width="1.3" marker-end="url(#a)"/>
