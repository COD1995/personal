<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" font-family="'Source Sans 3','Source Sans Pro','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#1e1c19">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f2e4a"/></marker>
  </defs>
  <g font-size="11.5" letter-spacing="1.8" fill="#8a6a3a" text-anchor="middle">
    <text x="75" y="22">INPUTS</text><text x="245" y="22">ENCODE AS TENSOR</text><text x="440" y="22">NEURAL NETWORK</text><text x="672" y="22">OUTPUTS</text>
  </g>
