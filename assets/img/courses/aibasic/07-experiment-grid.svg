<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" font-family="'Source Sans 3','Source Sans Pro','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#1e1c19">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f2e4a"/></marker>
  </defs>
  <!-- grid titles -->
  <g font-size="11.5" letter-spacing="1.8" fill="#8a6a3a" text-anchor="middle">
    <text x="290" y="26">10% OF THE DATA</text>
    <text x="570" y="26">20% OF THE DATA</text>
  </g>
  <line x1="180" y1="36" x2="400" y2="36" stroke="#d9d0bf"/>
  <line x1="460" y1="36" x2="680" y2="36" stroke="#d9d0bf"/>
  <!-- column headers -->
  <g fill="#5d574d" text-anchor="middle" font-size="13.5">
    <text x="234" y="66">5 epochs</text><text x="346" y="66">10 epochs</text>
    <text x="514" y="66">5 epochs</text><text x="626" y="66">10 epochs</text>
  </g>
  <!-- row headers -->
  <g text-anchor="end">
    <text x="168" y="117">EfficientNet-B0</text>
    <text x="168" y="181">EfficientNet-B2</text>
  </g>
  <!-- 10% grid -->
  <g font-size="24" text-anchor="middle" fill="#1f2e4a">
    <rect x="180" y="82" width="108" height="60" fill="#fbf8f2" stroke="#8a6a3a" stroke-width="1.6"/><text x="234" y="121">1</text>
    <rect x="292" y="82" width="108" height="60" fill="#fbf8f2" stroke="#b9ad96"/><text x="346" y="121">3</text>
    <rect x="180" y="146" width="108" height="60" fill="#fbf8f2" stroke="#b9ad96"/><text x="234" y="185">2</text>
    <rect x="292" y="146" width="108" height="60" fill="#fbf8f2" stroke="#b9ad96"/><text x="346" y="185">4</text>
  <!-- 20% grid -->
    <rect x="460" y="82" width="108" height="60" fill="#fbf8f2" stroke="#b9ad96"/><text x="514" y="121">5</text>
    <rect x="572" y="82" width="108" height="60" fill="#fbf8f2" stroke="#b9ad96"/><text x="626" y="121">7</text>
    <rect x="460" y="146" width="108" height="60" fill="#fbf8f2" stroke="#b9ad96"/><text x="514" y="185">6</text>
    <rect x="572" y="146" width="108" height="60" fill="#1f2e4a"/><text x="626" y="185" fill="#f6f2e9">8</text>
  </g>
  <!-- between grids -->
  <path d="M406 144 L454 144" stroke="#1f2e4a" stroke-width="1.3" marker-end="url(#a)"/>
  <text x="430" y="134" text-anchor="middle" font-size="12.5" fill="#5d574d">2× data</text>
  <!-- notes -->
  <g font-size="12.5" fill="#5d574d" text-anchor="middle">
    <text x="290" y="234">1: least data, smaller model, 5 epochs</text>
    <text x="570" y="234">8: most data, larger model, 10 epochs</text>
  </g>
</svg>
