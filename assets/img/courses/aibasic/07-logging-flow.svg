<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 214" font-family="'Source Sans 3','Source Sans Pro','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#1e1c19">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f2e4a"/></marker>
  </defs>
  <g font-size="11.5" letter-spacing="1.8" fill="#8a6a3a" text-anchor="middle">
    <text x="80" y="22">TRAINING LOOP</text><text x="269" y="22">SUMMARYWRITER</text><text x="478" y="22">RUNS/ FOLDER</text><text x="683" y="22">TENSORBOARD</text>
  </g>
  <!-- training loop -->
  <rect x="10" y="44" width="140" height="130" fill="#fbf8f2" stroke="#1f2e4a"/>
  <g font-family="'JetBrains Mono',Menlo,monospace" font-size="11.5" fill="#1f2e4a">
    <text x="20" y="70">for epoch in ...:</text>
    <text x="34" y="92">train_step(...)</text>
    <text x="34" y="112">test_step(...)</text>
    <text x="34" y="138" fill="#8a6a3a">writer.add_</text>
    <text x="48" y="155" fill="#8a6a3a">scalars(...)</text>
  </g>
  <text x="80" y="196" text-anchor="middle" font-size="12.5" fill="#5d574d">every epoch</text>
  <!-- arrow 1 -->
  <path d="M154 109 L200 109" stroke="#1f2e4a" stroke-width="1.3" marker-end="url(#a)"/>
  <text x="176" y="99" text-anchor="middle" font-size="11.5" fill="#5d574d">metrics</text>
  <!-- writer -->
  <rect x="204" y="82" width="130" height="54" fill="#1f2e4a"/>
  <text x="269" y="106" text-anchor="middle" fill="#f6f2e9">SummaryWriter</text>
  <text x="269" y="124" text-anchor="middle" fill="#f6f2e9" font-family="'JetBrains Mono',Menlo,monospace" font-size="11">(log_dir=...)</text>
  <text x="269" y="160" text-anchor="middle" font-size="12.5" fill="#5d574d">one writer per run,</text>
  <text x="269" y="176" text-anchor="middle" font-size="12.5" fill="#5d574d">from create_writer()</text>
  <!-- arrow 2 -->
  <path d="M338 109 L372 109" stroke="#1f2e4a" stroke-width="1.3" marker-end="url(#a)"/>
  <text x="355" y="99" text-anchor="middle" font-size="11.5" fill="#5d574d">writes</text>
  <!-- runs folder -->
  <rect x="376" y="44" width="204" height="130" fill="#fbf8f2" stroke="#b9ad96"/>
  <g font-family="'JetBrains Mono',Menlo,monospace" font-size="11" fill="#1e1c19">
    <text x="386" y="66">runs/2026-09-28/</text>
    <text x="399" y="84">data_10_percent/</text>
    <text x="412" y="100" fill="#1f2e4a">effnetb0/5_epochs/</text>
    <text x="412" y="116" fill="#1f2e4a">effnetb2/5_epochs/</text>
    <text x="399" y="134">data_20_percent/</text>
    <text x="412" y="150" fill="#1f2e4a">effnetb0/5_epochs/</text>
    <text x="412" y="166" fill="#5d574d">...</text>
  </g>
  <text x="478" y="196" text-anchor="middle" font-size="12.5" fill="#5d574d">event files, one folder per run</text>
  <!-- arrow 3 -->
  <path d="M584 109 L612 109" stroke="#1f2e4a" stroke-width="1.3" marker-end="url(#a)"/>
  <text x="598" y="99" text-anchor="middle" font-size="11.5" fill="#5d574d">reads</text>
  <!-- tensorboard chart -->
  <rect x="616" y="44" width="134" height="130" fill="#fbf8f2" stroke="#b9ad96"/>
  <text x="626" y="62" font-size="11.5" fill="#5d574d">Loss</text>
  <line x1="632" y1="72" x2="632" y2="152" stroke="#b9ad96"/>
  <line x1="632" y1="152" x2="740" y2="152" stroke="#b9ad96"/>
  <g fill="none" stroke-width="1.6">
    <polyline points="636,80 656,104 676,118 696,126 716,131 736,134" stroke="#1f2e4a"/>
    <polyline points="636,84 656,110 676,124 696,133 716,138 736,141" stroke="#8a6a3a"/>
    <polyline points="636,78 656,96 676,108 696,115 716,119 736,121" stroke="#b9ad96"/>
  </g>
  <text x="686" y="168" text-anchor="middle" font-size="11" fill="#5d574d">epoch</text>
  <text x="683" y="196" text-anchor="middle" font-size="12.5" fill="#5d574d">one curve per run</text>
</svg>
