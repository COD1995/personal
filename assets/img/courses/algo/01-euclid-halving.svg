<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" font-family="'Source Sans 3','Source Sans Pro','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#1e1c19">
  <text x="60" y="30" fill="#8a6a3a" font-size="12.5" letter-spacing="1.6">CASE 1:  b ≤ a/2</text>
  <line x1="60" y1="85" x2="700" y2="85" stroke="#b9ad96" stroke-width="1.3"/>
  <line x1="60.0" y1="77" x2="60.0" y2="93" stroke="#1e1c19" stroke-width="1.3"/>
  <text x="60.0" y="112" text-anchor="middle" fill="#1e1c19" font-size="14.5" font-style="italic">0</text>
  <line x1="700.0" y1="77" x2="700.0" y2="93" stroke="#1e1c19" stroke-width="1.3"/>
  <text x="700.0" y="112" text-anchor="middle" fill="#1e1c19" font-size="14.5" font-style="italic">a</text>
  <line x1="380.0" y1="71" x2="380.0" y2="99" stroke="#8a6a3a" stroke-dasharray="3 3"/>
  <text x="380.0" y="112" text-anchor="middle" fill="#8a6a3a" font-size="14.5" font-style="italic">a/2</text>
  <line x1="252.0" y1="77" x2="252.0" y2="93" stroke="#5d574d" stroke-width="1.3"/>
  <text x="252.0" y="112" text-anchor="middle" fill="#5d574d" font-size="14.5" font-style="italic">b</text>
  <line x1="444.0" y1="77" x2="444.0" y2="93" stroke="#5d574d" stroke-width="1.3"/>
  <text x="444.0" y="112" text-anchor="middle" fill="#5d574d" font-size="14.5" font-style="italic">2b</text>
  <line x1="636.0" y1="77" x2="636.0" y2="93" stroke="#5d574d" stroke-width="1.3"/>
  <text x="636.0" y="112" text-anchor="middle" fill="#5d574d" font-size="14.5" font-style="italic">3b</text>
  <rect x="636.0" y="80" width="64.0" height="10" fill="#1f2e4a"/>
  <text x="700.0" y="69" text-anchor="end" fill="#1f2e4a" font-size="14.5" font-style="italic">a mod b  &lt;  b  ≤  a/2</text>
  <text x="60" y="160" fill="#8a6a3a" font-size="12.5" letter-spacing="1.6">CASE 2:  b &gt; a/2</text>
  <line x1="60" y1="215" x2="700" y2="215" stroke="#b9ad96" stroke-width="1.3"/>
  <line x1="60.0" y1="207" x2="60.0" y2="223" stroke="#1e1c19" stroke-width="1.3"/>
  <text x="60.0" y="242" text-anchor="middle" fill="#1e1c19" font-size="14.5" font-style="italic">0</text>
  <line x1="700.0" y1="207" x2="700.0" y2="223" stroke="#1e1c19" stroke-width="1.3"/>
  <text x="700.0" y="242" text-anchor="middle" fill="#1e1c19" font-size="14.5" font-style="italic">a</text>
  <line x1="380.0" y1="201" x2="380.0" y2="229" stroke="#8a6a3a" stroke-dasharray="3 3"/>
  <text x="380.0" y="242" text-anchor="middle" fill="#8a6a3a" font-size="14.5" font-style="italic">a/2</text>
  <line x1="508.0" y1="207" x2="508.0" y2="223" stroke="#5d574d" stroke-width="1.3"/>
  <text x="508.0" y="242" text-anchor="middle" fill="#5d574d" font-size="14.5" font-style="italic">b</text>
  <rect x="508.0" y="210" width="192.0" height="10" fill="#1f2e4a"/>
  <text x="604.0" y="199" text-anchor="middle" fill="#1f2e4a" font-size="14.5" font-style="italic">a mod b  =  a − b  &lt;  a/2</text>
</svg>
