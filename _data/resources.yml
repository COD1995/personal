- title: Dive into Deep Learning
  url: https://d2l.ai
  authors: Zhang, Lipton, Li & Smola
  cover: d2l.jpg
  desc: Interactive textbook with full implementations in PyTorch, MXNet, and JAX. The reference I lean on most in CSE 676.
- title: "Deep Learning: Foundations and Concepts"
  url: https://www.bishopbook.com
  authors: Christopher M. Bishop & Hugh Bishop
  cover: bishop-deep-learning.jpg
  desc: A modern volume bridging classical ML to deep learning — the spiritual successor to PRML.
- title: Pattern Recognition and Machine Learning
  authors: Christopher M. Bishop
  cover: bishop-prml.jpg
  desc: The classic graduate ML text (2006). A rigorous foundation in Bayesian methods, kernels, and graphical models — freely available online as a PDF.
